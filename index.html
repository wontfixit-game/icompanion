<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a1224" />
    <title>icompanion · 相片怪獸</title>
    <link rel="stylesheet" href="css/app.css" />
    <script defer src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <section id="screen-home" class="screen active" data-screen="home">
        <header class="topbar">
          <div>
            <div class="brand">icompanion</div>
            <h1 id="homeName" class="monster-name">未命名獸</h1>
          </div>
          <div class="topmeta">
            <span id="homeStage" class="chip">幼體</span>
            <span id="homeAge" class="chip muted">0h</span>
          </div>
        </header>

        <div class="stage">
          <canvas id="roomCanvas" width="720" height="420"></canvas>
          <div id="statusBanner" class="status-banner hidden"></div>
        </div>

        <div class="vitals">
          <div class="vital"><label>飽腹</label><div class="bar"><i id="barHunger"></i></div></div>
          <div class="vital"><label>心情</label><div class="bar"><i id="barMood"></i></div></div>
          <div class="vital"><label>體力</label><div class="bar"><i id="barEnergy"></i></div></div>
        </div>

        <div class="evo-hint" id="evoHint">照顧怪獸，累積條件後可進化。</div>

        <div class="thumb-pad" id="carePad">
          <button type="button" class="thumb-btn" data-care="feed"><span>🍖</span>餵食</button>
          <button type="button" class="thumb-btn" data-care="play"><span>🎾</span>玩耍</button>
          <button type="button" class="thumb-btn" data-care="train"><span>💪</span>訓練</button>
          <button type="button" class="thumb-btn" data-care="clean"><span>✨</span>清潔</button>
          <button type="button" class="thumb-btn" data-care="sleep"><span>😴</span>休息</button>
          <button type="button" class="thumb-btn" data-care="explore"><span>🧭</span>探險</button>
        </div>

        <details class="sheet">
          <summary>詳細數值 / 進化條件</summary>
          <div id="detailStats" class="detail-stats"></div>
          <button type="button" id="evolveBtn" class="btn primary block" disabled>進化</button>
          <div id="evoChoices" class="evo-choices"></div>
          <button type="button" id="debugBoost" class="btn block" style="margin-top:8px">
            測試：推進時間＋照顧（方便試進化）
          </button>
        </details>
      </section>

      <section id="screen-create" class="screen" data-screen="create">
        <header class="topbar">
          <div>
            <div class="brand">創作</div>
            <h1 class="monster-name">造一隻自己的怪</h1>
          </div>
          <div class="stepper" id="createStepper">
            <span data-step="1" class="on">1</span>
            <span data-step="2">2</span>
            <span data-step="3">3</span>
          </div>
        </header>

        <div class="create-steps">
          <div class="create-step active" data-create-step="1">
            <p class="lead">選材料。相片只係起稿，之後你可全改。</p>
            <div class="choice-grid">
              <label class="choice big" for="imageInput">
                <strong>📷 相片</strong>
                <small>轉 64×64 草稿</small>
              </label>
              <input id="imageInput" type="file" accept="image/*" hidden />
              <button type="button" class="choice big" id="randomMatBtn">
                <strong>🎲 隨機</strong>
                <small>色盤 + 模板</small>
              </button>
              <button type="button" class="choice big" id="blankStartBtn">
                <strong>⬜ 空白</strong>
                <small>由零畫起</small>
              </button>
            </div>
            <div class="row-tight">
              <select id="photoFitSel" aria-label="相片裁剪">
                <option value="crop">裁剪（頭像）</option>
                <option value="fit">完整縮入</option>
              </select>
              <select id="bgRemoveSel" aria-label="退地">
                <option value="edge">自動退地</option>
                <option value="none">不退地</option>
                <option value="light">淺底</option>
                <option value="dark">深底</option>
                <option value="green">綠幕</option>
                <option value="blue">藍幕</option>
              </select>
            </div>
            <div class="row-tight">
              <select id="templateSel" aria-label="模板">
                <option value="humanoid">人形</option>
                <option value="quad">四足</option>
                <option value="round">圓身</option>
                <option value="winged">飛行</option>
                <option value="mech">機械</option>
                <option value="plant">植物</option>
                <option value="ghost">幽靈</option>
                <option value="blank">空白</option>
              </select>
              <button type="button" id="makeTemplateBtn" class="btn">套模板</button>
            </div>
            <p id="matText" class="tiny">未讀取材料</p>
            <div id="palette" class="palette"></div>
            <button type="button" class="btn primary block" id="toStep2">下一步：微調</button>
          </div>

          <div class="create-step" data-create-step="2">
            <p class="lead">大拇指可畫。五官可拖。夠用就下一步。</p>
            <div class="editor-wrap">
              <canvas id="editCanvas" width="64" height="64"></canvas>
            </div>
            <div class="tool-row" id="simpleTools">
              <button type="button" class="tool on" data-tool="pen">筆</button>
              <button type="button" class="tool" data-tool="erase">擦</button>
              <button type="button" class="tool" data-tool="fill">填</button>
              <button type="button" id="undoBtn" class="tool">Undo</button>
              <input id="paintColor" type="color" value="#58c7ff" aria-label="顏色" />
            </div>
            <div class="tool-row" id="faceTools">
              <button type="button" class="face-btn" data-face="eyes">拖眼</button>
              <button type="button" class="face-btn" data-face="m">拖嘴</button>
              <button type="button" class="face-btn" data-face="face">拖臉</button>
              <button type="button" class="face-btn" data-face="">完成</button>
            </div>
            <details class="sheet">
              <summary>進階工具</summary>
              <div class="tool-row">
                <button type="button" class="tool" data-tool="pick">吸色</button>
                <button type="button" class="tool" data-tool="line">線</button>
                <button type="button" class="tool" data-tool="rect">框</button>
                <button type="button" class="tool" data-tool="ellipse">圓</button>
                <button type="button" id="mirrorBtn" class="tool">鏡像</button>
                <button type="button" id="outlineBtn" class="tool">輪廓</button>
                <button type="button" id="bakeBtn" class="tool">烘焙</button>
              </div>
              <div class="row-tight checks">
                <label><input id="exprEnabled" type="checkbox" checked />表情</label>
                <label><input id="exprEyes" type="checkbox" checked />眼</label>
                <label><input id="exprMouth" type="checkbox" checked />嘴</label>
              </div>
            </details>
            <div class="row-tight">
              <button type="button" class="btn" id="backStep1">返回</button>
              <button type="button" class="btn primary grow" id="toStep3">下一步：命名</button>
            </div>
          </div>

          <div class="create-step" data-create-step="3">
            <p class="lead">幫佢改名，然後開始育成。</p>
            <div class="card-preview">
              <canvas id="previewCanvas" width="128" height="128"></canvas>
              <input id="nameInput" type="text" maxlength="12" value="未命名獸" placeholder="名字" />
            </div>
            <div class="row-tight">
              <button type="button" class="btn" id="backStep2">返回</button>
              <button type="button" class="btn primary grow" id="hatchBtn">出巢！開始育成</button>
            </div>
          </div>
        </div>
      </section>

      <section id="screen-battle" class="screen" data-screen="battle">
        <header class="topbar">
          <div>
            <div class="brand">對戰</div>
            <h1 class="monster-name">證明育成成果</h1>
          </div>
          <span id="battleModeChip" class="chip">練習</span>
        </header>

        <div class="battle-stage">
          <div class="fighter foe">
            <div class="hp"><i id="foeHp"></i></div>
            <canvas id="foeCanvas" width="64" height="64"></canvas>
            <div id="foeName">訓練假體</div>
          </div>
          <div class="battle-log" id="battleLog">選擇模式開始。</div>
          <div class="fighter me">
            <div class="hp"><i id="meHp"></i></div>
            <canvas id="meCanvas" width="64" height="64"></canvas>
            <div id="meName">我方</div>
          </div>
        </div>

        <div class="mode-row">
          <button type="button" class="btn primary grow" id="practiceBtn">練習戰 (CPU)</button>
        </div>
        <div class="net-box">
          <p class="tiny">連線房（P2P，無需帳號）</p>
          <div class="row-tight">
            <button type="button" class="btn grow" id="hostBtn">開房</button>
            <input id="roomCode" type="text" maxlength="6" placeholder="房碼" autocomplete="off" />
            <button type="button" class="btn grow" id="joinBtn">入房</button>
          </div>
          <p id="netStatus" class="tiny">未連線</p>
        </div>

        <div class="thumb-pad battle-pad" id="battlePad">
          <button type="button" class="thumb-btn" data-move="attack" disabled><span>⚔️</span>攻擊</button>
          <button type="button" class="thumb-btn" data-move="skill" disabled><span>✨</span>特技</button>
          <button type="button" class="thumb-btn" data-move="guard" disabled><span>🛡️</span>防禦</button>
        </div>
      </section>

      <nav class="tabbar" id="tabbar">
        <button type="button" class="tab on" data-nav="home">育成</button>
        <button type="button" class="tab" data-nav="create">創作</button>
        <button type="button" class="tab" data-nav="battle">對戰</button>
      </nav>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
